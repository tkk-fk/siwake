<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F4EFE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1714" media="(prefers-color-scheme: dark)">
<meta name="description" content="心がしんどいとき、何が「変えられること」で何が「変えられないこと」かを分けるためのシンプルな道具。ストア派の二分法・アドラー心理学の課題の分離・老子の水の哲学に通じます。">
<meta property="og:title" content="コントロール分けマシン">
<meta property="og:description" content="変えられること、変えられないこと。心をどこに使うかを分けるための、ちいさな道具。">
<meta property="og:type" content="website">
<title>コントロール分けマシン</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23F4EFE6'/%3E%3Ctext y='75' x='50' font-size='75' text-anchor='middle' font-family='serif' fill='%232C2A26'%3E分%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;500;600&family=Zen+Maru+Gothic:wght@400;500;700&family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ============================================
   Theme tokens
   ============================================ */
:root {
  --paper: #F4EFE6;
  --paper-light: #FAF6EE;
  --paper-deep: #ECE5D6;
  --ink: #2C2A26;
  --ink-soft: #5A554D;
  --ink-faint: #8B857A;
  --sumi: #1A1815;
  --matcha: #7A8F5C;
  --matcha-soft: #DCE3CC;
  --matcha-deep: #5C7041;
  --asagi: #6B8290;
  --asagi-soft: #D3DBDF;
  --asagi-deep: #4D6470;
  --accent: #B8624A;
  --line: #D6CFC2;
  --shadow: rgba(60, 50, 40, 0.08);
  --focus-ring: rgba(184, 98, 74, 0.35);
}

@media (prefers-color-scheme: dark) {
  :root {
    --paper: #1A1714;
    --paper-light: #221F1B;
    --paper-deep: #15120F;
    --ink: #E8E2D6;
    --ink-soft: #B5AE9F;
    --ink-faint: #7A736A;
    --sumi: #F4EFE6;
    --matcha: #7A8F5C;
    --matcha-soft: #2D3424;
    --matcha-deep: #A5B584;
    --asagi: #6B8290;
    --asagi-soft: #243038;
    --asagi-deep: #9CB3BD;
    --accent: #D17A60;
    --line: #3A352F;
    --shadow: rgba(0, 0, 0, 0.25);
    --focus-ring: rgba(209, 122, 96, 0.4);
  }
}

/* ============================================
   Reset & base
   ============================================ */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  font-family: 'Zen Maru Gothic', sans-serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(40px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  background-image: 
    radial-gradient(circle at 15% 20%, rgba(184, 98, 74, 0.04) 0%, transparent 45%),
    radial-gradient(circle at 85% 80%, rgba(107, 130, 144, 0.05) 0%, transparent 45%);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  line-height: 1.6;
  -webkit-tap-highlight-color: transparent;
}

@media (prefers-color-scheme: dark) {
  body {
    background-image: 
      radial-gradient(circle at 15% 20%, rgba(209, 122, 96, 0.06) 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(156, 179, 189, 0.06) 0%, transparent 45%);
  }
}

button, textarea, input { font-family: inherit; }

button {
  -webkit-appearance: none;
  appearance: none;
  border: none;
  background: none;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
}

textarea {
  -webkit-appearance: none;
  appearance: none;
}

a {
  color: inherit;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

/* ============================================
   Focus states
   ============================================ */
:focus { outline: none; }

:focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: 2px;
  border-radius: 4px;
}

/* ============================================
   Layout
   ============================================ */
.container {
  width: 100%;
  max-width: 620px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

@media (min-width: 768px) {
  .container { gap: 28px; }
}

/* ============================================
   Header
   ============================================ */
header {
  text-align: center;
  padding: 8px 0 18px;
  border-bottom: 1px solid var(--line);
}

h1 {
  font-family: 'Zen Old Mincho', serif;
  font-weight: 500;
  font-size: clamp(22px, 5vw, 30px);
  color: var(--sumi);
  letter-spacing: 0.12em;
  margin-bottom: 6px;
  line-height: 1.3;
}

.subtitle {
  font-family: 'Zen Old Mincho', serif;
  font-size: clamp(11px, 2.5vw, 13px);
  color: var(--ink-faint);
  letter-spacing: 0.15em;
}

/* ============================================
   Card
   ============================================ */
.card {
  background: var(--paper-light);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 28px 20px;
  box-shadow: 0 1px 0 var(--shadow);
  position: relative;
}

@media (min-width: 480px) {
  .card { padding: 32px 24px; }
}

@media (min-width: 768px) {
  .card { padding: 40px 32px; }
}

/* ============================================
   Stage transitions
   ============================================ */
.stage {
  display: none;
  animation: fadeIn 0.4s ease-out;
}
.stage.active { display: block; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ============================================
   Input
   ============================================ */
.prompt-text {
  font-family: 'Zen Old Mincho', serif;
  font-size: clamp(16px, 4vw, 18px);
  color: var(--sumi);
  text-align: center;
  margin-bottom: 22px;
  letter-spacing: 0.1em;
}

textarea {
  width: 100%;
  min-height: 130px;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--paper);
  font-family: 'Klee One', 'Zen Maru Gothic', sans-serif;
  font-size: 16px; /* 16px+ prevents iOS auto-zoom */
  color: var(--ink);
  line-height: 1.8;
  resize: vertical;
  transition: border-color 0.2s, background 0.2s;
}

textarea:focus {
  outline: none;
  border-color: var(--ink-soft);
  background: var(--paper-light);
}

textarea::placeholder {
  color: var(--ink-faint);
  font-family: 'Zen Maru Gothic', sans-serif;
  font-size: 14px;
}

.char-count {
  text-align: right;
  font-size: 11px;
  color: var(--ink-faint);
  margin-top: 6px;
  letter-spacing: 0.05em;
  font-variant-numeric: tabular-nums;
}

/* ============================================
   Buttons
   ============================================ */
.btn {
  display: inline-block;
  padding: 14px 36px;
  min-height: 48px;
  border-radius: 4px;
  border: 1px solid var(--ink);
  background: var(--ink);
  color: var(--paper-light);
  font-weight: 500;
  font-size: 14px;
  letter-spacing: 0.18em;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
  touch-action: manipulation;
}

@media (hover: hover) {
  .btn:hover {
    background: var(--sumi);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px var(--shadow);
  }
}

.btn:active { transform: translateY(0); }

.btn-ghost {
  background: transparent;
  color: var(--ink-soft);
  border-color: var(--line);
}

@media (hover: hover) {
  .btn-ghost:hover {
    background: var(--paper-deep);
    color: var(--ink);
  }
}

@media (prefers-color-scheme: dark) {
  .btn {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink-soft);
  }
  .btn-ghost {
    background: transparent;
    color: var(--ink);
  }
}

/* ============================================
   Helpers
   ============================================ */
.center { text-align: center; }
.mt-24 { margin-top: 24px; }
.mt-16 { margin-top: 16px; }

/* ============================================
   Thought card (in sort stage)
   ============================================ */
.thought-card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 22px 22px 24px;
  font-family: 'Klee One', sans-serif;
  font-size: clamp(15px, 3.5vw, 17px);
  line-height: 1.9;
  color: var(--ink);
  margin-bottom: 28px;
  position: relative;
  box-shadow: 0 2px 8px var(--shadow);
  word-break: break-word;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.thought-card::before {
  content: '';
  position: absolute;
  top: -1px;
  left: 24px;
  width: 36px;
  height: 8px;
  background: var(--accent);
  opacity: 0.65;
  border-radius: 0 0 3px 3px;
}

/* ============================================
   Sort choices
   ============================================ */
.sort-question {
  font-family: 'Zen Old Mincho', serif;
  text-align: center;
  font-size: clamp(14px, 3.2vw, 15px);
  color: var(--ink-soft);
  margin-bottom: 18px;
  letter-spacing: 0.15em;
}

.choices {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

@media (max-width: 420px) {
  .choices { grid-template-columns: 1fr; }
}

.choice {
  padding: 24px 14px;
  min-height: 120px;
  border-radius: 4px;
  border: 1px solid var(--line);
  background: var(--paper-light);
  cursor: pointer;
  text-align: center;
  transition: background 0.25s, border-color 0.25s, transform 0.15s;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

@media (min-width: 768px) {
  .choice { padding: 28px 16px; min-height: 140px; }
}

@media (hover: hover) {
  .choice-matcha:hover {
    background: var(--matcha-soft);
    border-color: var(--matcha);
    transform: translateY(-2px);
  }
  .choice-asagi:hover {
    background: var(--asagi-soft);
    border-color: var(--asagi);
    transform: translateY(-2px);
  }
}

.choice:active { transform: translateY(0); }
.choice-matcha:active { background: var(--matcha-soft); border-color: var(--matcha); }
.choice-asagi:active { background: var(--asagi-soft); border-color: var(--asagi); }

.choice-mark {
  font-family: 'Zen Old Mincho', serif;
  font-size: clamp(28px, 7vw, 32px);
  display: block;
  margin-bottom: 10px;
  font-weight: 500;
  line-height: 1;
}

.choice-matcha .choice-mark { color: var(--matcha-deep); }
.choice-asagi .choice-mark { color: var(--asagi-deep); }

.choice-label {
  font-size: clamp(14px, 3.5vw, 15px);
  font-weight: 500;
  color: var(--ink);
  letter-spacing: 0.08em;
  display: block;
}

.choice-hint {
  font-size: 11px;
  color: var(--ink-faint);
  margin-top: 6px;
  display: block;
  letter-spacing: 0.08em;
  line-height: 1.5;
}

/* ============================================
   Back link
   ============================================ */
.back-link {
  margin-top: 20px;
  text-align: center;
}

.back-link a {
  font-size: 12px;
  color: var(--ink-faint);
  cursor: pointer;
  text-decoration: underline;
  letter-spacing: 0.08em;
  padding: 8px 12px;
  display: inline-block;
}

@media (hover: hover) {
  .back-link a:hover { color: var(--ink); }
}

/* ============================================
   Result stages
   ============================================ */
.result-icon {
  font-family: 'Zen Old Mincho', serif;
  font-size: clamp(48px, 12vw, 64px);
  text-align: center;
  margin-bottom: 12px;
  letter-spacing: 0.1em;
  line-height: 1;
  animation: gentleFloat 4s ease-in-out infinite;
}

.result-icon.matcha { color: var(--matcha-deep); }
.result-icon.asagi { color: var(--asagi-deep); }
.result-icon.neutral {
  color: var(--ink-soft);
  font-size: clamp(36px, 10vw, 48px);
}

@keyframes gentleFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

@media (prefers-reduced-motion: reduce) {
  .result-icon { animation: none; }
  .stage { animation: none; }
}

.result-title {
  font-family: 'Zen Old Mincho', serif;
  font-size: clamp(18px, 4.5vw, 20px);
  text-align: center;
  color: var(--sumi);
  margin-bottom: 14px;
  letter-spacing: 0.1em;
}

.result-text {
  text-align: center;
  color: var(--ink-soft);
  line-height: 2;
  margin-bottom: 20px;
  font-size: clamp(13px, 3vw, 14px);
}

.result-text .small {
  display: block;
  color: var(--ink-faint);
  font-size: 12px;
  margin-top: 8px;
  font-family: 'Zen Old Mincho', serif;
  font-style: italic;
}

/* ============================================
   History
   ============================================ */
.history-toggle {
  text-align: center;
}

.history-toggle a {
  display: inline-block;
  font-size: 12px;
  color: var(--ink-faint);
  text-decoration: underline;
  cursor: pointer;
  letter-spacing: 0.12em;
  padding: 8px 12px;
}

@media (hover: hover) {
  .history-toggle a:hover { color: var(--ink); }
}

.history {
  display: none;
  margin-top: 4px;
}

.history.open { display: block; animation: fadeIn 0.3s ease-out; }

.history-columns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

@media (max-width: 540px) {
  .history-columns {
    grid-template-columns: 1fr;
    gap: 20px;
  }
}

.history-col h3 {
  font-family: 'Zen Old Mincho', serif;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.15em;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
  text-align: center;
}

.history-col.matcha h3 { color: var(--matcha-deep); }
.history-col.asagi h3 { color: var(--asagi-deep); }

.history-item {
  background: var(--paper-light);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 12px 14px;
  margin-bottom: 8px;
  font-size: 14px;
  line-height: 1.7;
  color: var(--ink);
  font-family: 'Klee One', sans-serif;
  word-break: break-word;
  overflow-wrap: anywhere;
}

.history-item .action {
  display: block;
  margin-top: 6px;
  padding-top: 6px;
  border-top: 1px dashed var(--line);
  font-size: 12px;
  color: var(--matcha-deep);
  font-family: 'Zen Maru Gothic', sans-serif;
  letter-spacing: 0.03em;
}

.history-item .action::before {
  content: '→ ';
  color: var(--ink-faint);
}

.history-empty {
  font-size: 12px;
  color: var(--ink-faint);
  text-align: center;
  padding: 20px 0;
  font-family: 'Zen Old Mincho', serif;
}

.history-actions {
  text-align: center;
  margin-top: 16px;
}

.history-actions a {
  display: inline-block;
  font-size: 11px;
  color: var(--ink-faint);
  cursor: pointer;
  text-decoration: underline;
  letter-spacing: 0.08em;
  padding: 8px 12px;
}

@media (hover: hover) {
  .history-actions a:hover { color: var(--accent); }
}

/* ============================================
   Footer
   ============================================ */
footer {
  text-align: center;
  margin-top: 4px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
}

.quote {
  font-family: 'Zen Old Mincho', serif;
  font-size: clamp(11px, 2.5vw, 12px);
  color: var(--ink-faint);
  letter-spacing: 0.08em;
  line-height: 1.9;
  max-width: 480px;
  margin: 0 auto;
}

.quote .author {
  display: block;
  margin-top: 4px;
  font-size: 10px;
  letter-spacing: 0.18em;
}

/* ============================================
   Wider screens
   ============================================ */
@media (min-width: 1024px) {
  body { padding-top: 48px; padding-bottom: 64px; }
  header { padding: 16px 0 22px; }
}
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>コントロール分けマシン</h1>
    <p class="subtitle">変えられること、変えられないこと</p>
  </header>

  <main class="card">

    <section class="stage active" id="stage-input" aria-label="入力">
      <p class="prompt-text">いま、気になっていること</p>
      <textarea id="thought-input" maxlength="300" placeholder="心にひっかかっていること、もやもやしていることを書いてみよう" aria-label="気になっていることを書いてください"></textarea>
      <div class="char-count"><span id="char-count">0</span> / 300</div>
      <div class="center mt-24">
        <button class="btn" id="submit-btn">分けてみる</button>
      </div>
    </section>

    <section class="stage" id="stage-sort" aria-label="仕分け">
      <div class="thought-card" id="thought-display"></div>
      <p class="sort-question">これは、どっち?</p>
      <div class="choices">
        <button class="choice choice-matcha" data-choice="variable" aria-label="自分で変えられる">
          <span class="choice-mark" aria-hidden="true">動</span>
          <span class="choice-label">自分で変えられる</span>
          <span class="choice-hint">じぶんで動ける範囲のこと</span>
        </button>
        <button class="choice choice-asagi" data-choice="invariable" aria-label="変えられない">
          <span class="choice-mark" aria-hidden="true">流</span>
          <span class="choice-label">変えられない</span>
          <span class="choice-hint">他人や過去や運のこと</span>
        </button>
      </div>
      <div class="back-link">
        <a id="back-to-input" role="button" tabindex="0">書き直す</a>
      </div>
    </section>

    <section class="stage" id="stage-variable" aria-label="行動を考える">
      <div class="result-icon matcha" aria-hidden="true">芽</div>
      <p class="result-title">変えられるなら、動ける。</p>
      <p class="result-text">
        じゃあ、今日できることを<br>
        ひとつだけ書いてみよう。
      </p>
      <textarea id="action-input" maxlength="200" placeholder="ちいさな一歩でいい" style="min-height: 90px;" aria-label="今日できることを書いてください"></textarea>
      <div class="center mt-24">
        <button class="btn" id="save-action-btn">これでいく</button>
      </div>
    </section>

    <section class="stage" id="stage-invariable" aria-label="手放す">
      <div class="result-icon asagi" aria-hidden="true">流</div>
      <p class="result-title">それは、おいておこう。</p>
      <p class="result-text">
        自分でコントロールできないことに、<br>
        心をつかわなくていい。
        <span class="small">川は、流れる方へ流れていく。</span>
      </p>
      <div class="center mt-24">
        <button class="btn" id="release-btn">てばなす</button>
      </div>
    </section>

    <section class="stage" id="stage-done" aria-label="完了">
      <div class="result-icon neutral" aria-hidden="true">○</div>
      <p class="result-title">記録しました。</p>
      <p class="result-text">いつでも、また分けにきてね。</p>
      <div class="center mt-24">
        <button class="btn btn-ghost" id="restart-btn">もう一つ分ける</button>
      </div>
    </section>

  </main>

  <div class="history-toggle">
    <a id="history-link" role="button" tabindex="0">これまでの記録を見る</a>
  </div>

  <section class="history" id="history" aria-label="これまでの記録">
    <div class="history-columns">
      <div class="history-col matcha">
        <h3>動 ・ 変えられること</h3>
        <div id="history-variable"></div>
      </div>
      <div class="history-col asagi">
        <h3>流 ・ 変えられないこと</h3>
        <div id="history-invariable"></div>
      </div>
    </div>
    <div class="history-actions">
      <a id="clear-link" role="button" tabindex="0">全部けす</a>
    </div>
  </section>

  <footer>
    <p class="quote">
      我々を悩ますものは、物事そのものではなく、物事について抱く考えである。
      <span class="author">— エピクテトス</span>
    </p>
  </footer>
</div>

<script>
(function () {
  'use strict';

  // ============================================
  // State
  // ============================================
  const STORAGE_KEY = 'control-machine-entries';
  let currentThought = '';
  let entries = [];

  // ============================================
  // Storage (localStorage with safe fallback)
  // ============================================
  function loadEntries() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) entries = JSON.parse(raw);
    } catch (e) {
      entries = [];
    }
    renderHistory();
  }

  function saveEntries() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    } catch (e) {
      // Storage might be unavailable (private mode, etc.) — fail silently
    }
  }

  function clearEntries() {
    try {
      localStorage.removeItem(STORAGE_KEY);
    } catch (e) {}
    entries = [];
    renderHistory();
  }

  // ============================================
  // Stage management
  // ============================================
  function showStage(id) {
    document.querySelectorAll('.stage').forEach(s => s.classList.remove('active'));
    const el = document.getElementById(id);
    el.classList.add('active');

    // Scroll to top of card on stage change so users always see the new stage
    const card = document.querySelector('.card');
    if (card) {
      const top = card.getBoundingClientRect().top + window.scrollY - 16;
      if (Math.abs(window.scrollY - top) > 80) {
        window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
      }
    }

    // Auto-focus textarea on input stages (desktop only — avoid mobile keyboard pop)
    if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
      const ta = el.querySelector('textarea');
      if (ta) setTimeout(() => ta.focus(), 250);
    }
  }

  // ============================================
  // Event handlers
  // ============================================
  const thoughtInput = document.getElementById('thought-input');
  const charCount = document.getElementById('char-count');

  thoughtInput.addEventListener('input', () => {
    charCount.textContent = thoughtInput.value.length;
  });

  document.getElementById('submit-btn').addEventListener('click', () => {
    const text = thoughtInput.value.trim();
    if (!text) {
      thoughtInput.focus();
      return;
    }
    currentThought = text;
    document.getElementById('thought-display').textContent = text;
    showStage('stage-sort');
  });

  const backLink = document.getElementById('back-to-input');
  backLink.addEventListener('click', () => showStage('stage-input'));
  backLink.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); showStage('stage-input'); }
  });

  document.querySelectorAll('.choice').forEach(btn => {
    btn.addEventListener('click', () => {
      const choice = btn.dataset.choice;
      if (choice === 'variable') {
        document.getElementById('action-input').value = '';
        showStage('stage-variable');
      } else {
        showStage('stage-invariable');
      }
    });
  });

  document.getElementById('save-action-btn').addEventListener('click', () => {
    const action = document.getElementById('action-input').value.trim();
    entries.unshift({
      text: currentThought,
      category: 'variable',
      action: action,
      timestamp: Date.now()
    });
    saveEntries();
    renderHistory();
    showStage('stage-done');
  });

  document.getElementById('release-btn').addEventListener('click', () => {
    entries.unshift({
      text: currentThought,
      category: 'invariable',
      timestamp: Date.now()
    });
    saveEntries();
    renderHistory();
    showStage('stage-done');
  });

  document.getElementById('restart-btn').addEventListener('click', () => {
    thoughtInput.value = '';
    charCount.textContent = '0';
    document.getElementById('action-input').value = '';
    currentThought = '';
    showStage('stage-input');
  });

  const historyLink = document.getElementById('history-link');
  const historyEl = document.getElementById('history');
  function toggleHistory() {
    historyEl.classList.toggle('open');
    historyLink.textContent = historyEl.classList.contains('open')
      ? '記録をとじる'
      : 'これまでの記録を見る';
  }
  historyLink.addEventListener('click', toggleHistory);
  historyLink.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleHistory(); }
  });

  const clearLink = document.getElementById('clear-link');
  function handleClear() {
    if (entries.length === 0) return;
    if (confirm('これまでの記録を全部けします。よろしいですか?')) {
      clearEntries();
    }
  }
  clearLink.addEventListener('click', handleClear);
  clearLink.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); handleClear(); }
  });

  // ============================================
  // History rendering
  // ============================================
  function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  function renderHistory() {
    const variableCol = document.getElementById('history-variable');
    const invariableCol = document.getElementById('history-invariable');
    const variableEntries = entries.filter(e => e.category === 'variable');
    const invariableEntries = entries.filter(e => e.category === 'invariable');

    variableCol.innerHTML = variableEntries.length === 0
      ? '<p class="history-empty">まだ ありません</p>'
      : variableEntries.map(e => `
          <div class="history-item">
            ${escapeHtml(e.text)}
            ${e.action ? `<span class="action">${escapeHtml(e.action)}</span>` : ''}
          </div>
        `).join('');

    invariableCol.innerHTML = invariableEntries.length === 0
      ? '<p class="history-empty">まだ ありません</p>'
      : invariableEntries.map(e => `
          <div class="history-item">${escapeHtml(e.text)}</div>
        `).join('');
  }

  // ============================================
  // Init
  // ============================================
  loadEntries();
})();
</script>

</body>
</html>
